[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bt_api_okx"
version = "0.15.4"
description = "OKX exchange plugin for bt_api"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "bt_api_base>=0.15,<1.0",
    "requests>=2.28",
    "websocket-client>=1.5",
    "aiohttp>=3.9",
]

[project.entry-points."bt_api.plugins"]
okx = "bt_api_okx.plugin:register_plugin"

[project.entry-points."bt_api.order_identity_projections"]
OKX___SPOT = "bt_api_okx.order_identity_projection:project_order_identity"
OKX___SWAP = "bt_api_okx.order_identity_projection:project_order_identity"

[project.entry-points."bt_api.order_request_projections"]
OKX___SPOT = "bt_api_okx.order_request_mapping:map_order_request"
OKX___SWAP = "bt_api_okx.order_request_mapping:map_order_request"

[project.entry-points."bt_api.order_readiness_providers"]
OKX___SWAP = "bt_api_okx.order_readiness_service:collect_order_readiness"

[project.entry-points."bt_api.position_mode_writers"]
OKX___SWAP = "bt_api_okx.position_mode_projection:write_position_mode"

[project.entry-points."bt_api.position_mode_read_aliases"]
OKX___SPOT = "bt_api_okx.position_mode_projection:position_mode_read_aliases"
OKX___SWAP = "bt_api_okx.position_mode_projection:position_mode_read_aliases"

[project.entry-points."bt_api.order_quantity_unit_validators"]
OKX___SPOT = "bt_api_base.order_quantity_units:validate_generic_order_quantity_units"
OKX___SWAP = "bt_api_okx.order_quantity_units:validate_order_quantity_units"

[project.entry-points."bt_api.fee_projections"]
OKX___SPOT = "bt_api_okx.fee_projection:create_fee_projection"
OKX___SWAP = "bt_api_okx.fee_projection:create_fee_projection"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "kline: Kline/bar data tests",
    "network: Tests requiring network access",
]

[tool.setuptools.package-data]
bt_api_okx = ["configs/*.yaml"]
